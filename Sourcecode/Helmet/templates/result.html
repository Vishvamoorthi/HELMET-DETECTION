<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Detection Results</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            color: white;
        }

        .card {
            border-radius: 20px;
        }

        .plate-box {
            font-size: 20px;
            font-weight: bold;
            background: #000;
            color: #0f0;
            padding: 10px 20px;
            border-radius: 10px;
            letter-spacing: 2px;
            margin: 10px;
            display: inline-block;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center">

<div class="container text-center">
    <div class="card p-4 shadow-lg bg-dark">

        <h2 class="mb-4">🚗 Detected Number Plates</h2>

        {% if plates %}
            <div>
                {% for plate in plates %}
                    <div class="plate-box">
                        {{ plate }}
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <p class="text-warning">No number plates detected</p>
        {% endif %}

        <br>

        <a href="/" class="btn btn-primary mt-3">
            ⬅ Upload Another Video
        </a>

    </div>
</div>

</body>
</html>
